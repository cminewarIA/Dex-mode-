name: Build Lapdock OS ISO (Ventoy Ready)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Nombre de la etiqueta/versión (ej. latest o v1.0.0)'
        required: false
        default: 'latest'

permissions:
  contents: write

jobs:
  build-iso:
    name: Compilar y Publicar ISO Pública
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Instalar Dependencias del Host de Compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap \
            debian-archive-keyring \
            squashfs-tools \
            xorriso \
            isolinux \
            syslinux-efi \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            mtools \
            dosfstools \
            wget \
            curl \
            coreutils

      - name: Hacer ejecutables los scripts
        run: |
          chmod +x scripts/*.sh || true
          chmod +x scripts/*.py || true

      - name: Compilar Imagen ISO de Lapdock OS
        run: |
          mkdir -p output
          sudo bash scripts/build-lapdock-iso.sh

      - name: Generar Sumas de Verificación SHA256
        run: |
          cd output
          sha256sum Lapdock-OS-*.iso > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Subir ISO como Artefacto Temporal
        uses: actions/upload-artifact@v4
        with:
          name: Lapdock-OS-Ventoy-ISO
          path: |
            output/Lapdock-OS-*.iso
            output/SHA256SUMS.txt
          retention-days: 30

      - name: Publicar Release Público en GitHub (Descarga Directa)
        # Se ejecuta siempre en push a main/master, tags o ejecución manual
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            output/Lapdock-OS-*.iso
            output/SHA256SUMS.txt
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.release_tag || 'latest') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Lapdock OS {0}', github.ref_name) || 'Lapdock OS (Versión Pública Oficial para Ventoy)' }}
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🚀 Lapdock OS - Descarga Oficial para Ventoy

            Esta imagen ISO está compilada y lista para descargarse directamente y copiarse a una memoria USB con **[Ventoy](https://www.ventoy.net/)**.

            ### 📦 Archivos Descargables:
            * **`Lapdock-OS-x86_64.iso`**: Imagen híbrida booteable en equipos **UEFI** y **BIOS Legacy**.
            * **`SHA256SUMS.txt`**: Suma de verificación criptográfica para validar el archivo.

            ### ⚡ Instrucciones Rápidas:
            1. Descarga el archivo **`Lapdock-OS-x86_64.iso`** que aparece abajo en los **Assets**.
            2. Cópialo directamente a tu pendrive con Ventoy (sin formatear ni usar Rufus).
            3. Inicia tu PC o portátil desde el USB y conecta tu móvil Samsung (DeX), Nintendo Switch o Android.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
