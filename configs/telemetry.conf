# ==============================================================================
# Lapdock OS - Configuración de Telemetría Comunitaria y Diagnóstico
# Archivo de configuración: /etc/lapdock/telemetry.conf
# ==============================================================================
#
# Lapdock OS recopila exclusivamente información técnica de compatibilidad
# (modelo de GPU, pantalla, controlador DRM, conectividad USB/audio) para
# detectar fallos de hardware en miles de modelos de PC y mejorar el soporte.
#
# POLÍTICA DE PRIVACIDAD:
# - CERO datos personales, archivos, contraseñas ni pulsaciones de teclado.
# - El ID del equipo se calcula con un hash SHA-256 anónimo.
# - Todas las conexiones se realizan de forma cifrada mediante TLS/SSL por DNS.
#
# Para desactivar completamente la telemetría:
# 1. Cambia ENABLED=false en este archivo, O BIEN
# 2. Añade "notelemetry" o "lapdock.telemetry=0" a la línea de arranque en GRUB/iPXE.
# ==============================================================================

# Estado de la telemetría (true / false)
ENABLED=true

# Host o Dominio DNS del servidor de telemetría comunitario
# Puedes sustituirlo por tu propio dominio o servidor si lo prefieres
SERVER_HOST=telemetry.lapdock.net

# Puerto de escucha del servicio (por defecto 8998)
SERVER_PORT=8998

# Cifrado de transporte TLS/SSL (extremo a extremo)
USE_TLS=true

# Verificación estricta de certificado CA (false permite certificados autofirmados)
VERIFY_TLS=false
